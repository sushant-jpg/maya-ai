services:
  maya:
    build: .
    ports:
      - "${MAYA_HOST:-127.0.0.1}:${PORT:-3000}:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-120000}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MAYA_ENABLE_DEEPSEEK: ${MAYA_ENABLE_DEEPSEEK:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MAYA_ENABLE_OPENAI: ${MAYA_ENABLE_OPENAI:-true}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MAYA_ENABLE_OPENROUTER: ${MAYA_ENABLE_OPENROUTER:-true}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MAYA_ENABLE_GEMINI: ${MAYA_ENABLE_GEMINI:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MAYA_ENABLE_ANTHROPIC: ${MAYA_ENABLE_ANTHROPIC:-true}
      CHROMA_URL: http://chroma:8000
      RAG_MAX_DISTANCE: ${RAG_MAX_DISTANCE:-0.45}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-none}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
    depends_on:
      ollama:
        condition: service_healthy
      chroma:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    # Enable this reservation on hosts with a Docker NVIDIA runtime.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  chroma:
    image: chromadb/chroma:1.0.15
    ports:
      - "${CHROMA_HOST:-127.0.0.1}:8000:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma-data:/chroma/chroma
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  ollama-data:
  chroma-data:
